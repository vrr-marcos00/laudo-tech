spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/laudotech}
    username: ${DATABASE_USERNAME:laudotech}
    password: ${DATABASE_PASSWORD:laudotech123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:laudotech-super-secret-key-256bits-minimum-length-required}
    expiration-ms: 86400000  # 24h
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Public base URL for reading files, with no trailing slash and no object path.
    # For MinIO/local dev this defaults to <endpoint>/<bucket> (S3 endpoint doubles as public URL).
    # For providers where the S3 API endpoint is not publicly reachable (e.g. Cloudflare R2),
    # set this to the bucket's public domain (r2.dev subdomain or custom domain) instead.
    public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT:http://localhost:9000}/${MINIO_BUCKET:laudotech}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:laudotech}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  pdf:
    # How many photos are downloaded/re-encoded concurrently during PDF generation.
    # Higher = faster for reports with many photos, but each full-resolution photo
    # decode can use tens of MB of heap while in flight, so this is capped low by
    # default to fit hosting plans with modest memory limits.
    image-threads: ${PDF_IMAGE_THREADS:4}
